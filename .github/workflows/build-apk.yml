name: Build & Release J.A.R.V.I.S. (Android APK + Windows EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (Linux-native, skip Electron binary)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/JARVIS.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: release-android/JARVIS.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows Installer (JARVIS-Setup.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-EXE
          path: release/JARVIS-Setup.exe

  publish-release:
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release folder
        run: mkdir -p dist-release

      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-APK
          path: dist-release

      - name: Download Windows Installer
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Windows-EXE
          path: dist-release

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "J.A.R.V.I.S. v1.0.${{ github.run_number }}"
          body: |
            ### Instaladores oficiales de J.A.R.V.I.S.
            - **Computadoras Windows:** descarga e instala **`JARVIS-Setup.exe`**
            - **Teléfonos Android:** descarga e instala **`JARVIS.apk`**
            - Cada dispositivo guarda sus propias tareas, proyectos, hitos y configuración de forma 100% privada.
          files: dist-release/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
