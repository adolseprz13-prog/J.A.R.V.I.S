name: Build & Release J.A.R.V.I.S. Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (skip Electron binary download)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/debug/app-debug.apk release-out/JARVIS.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: release-out/JARVIS.apk

      - name: Publish / Update GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "J.A.R.V.I.S. v1.0.${{ github.run_number }}"
          body: |
            ### Actualización automática de J.A.R.V.I.S. para Android
            - **Commit:** `${{ github.sha }}`
            - **Descarga:** Toca **JARVIS.apk** abajo para instalar o actualizar en tu teléfono Android.
            - Tus tareas, proyectos, hitos y configuración se guardan de forma privada en tu dispositivo y no se pierden al actualizar.
          files: release-out/JARVIS.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
